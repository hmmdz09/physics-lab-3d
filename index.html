<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lab Fisika 3D — Kemendikbud RI</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;900&family=Orbitron:wght@400;700;900&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="./css/style.css">
</head>
<body>

  <!-- Loading Overlay -->
  <div id="loading-overlay">
    <div class="loading-ring"></div>
    <div class="loading-text">MEMUAT LABORATORIUM FISIKA 3D...</div>
  </div>

  <!-- WebGL Canvas -->
  <canvas id="webgl-canvas"></canvas>

  <!-- Vignette overlay -->
  <div id="vignette"></div>

  <!-- Crosshair -->
  <div id="crosshair"></div>

  <!-- Scan-line effect -->
  <div id="scanlines"></div>

  <!-- TOP HUD ─────────────────────────────── -->
  <header id="hud-top">
    <div id="brand">
      <div id="brand-logo">
        <span class="logo-icon">⚗️</span>
        <div>
          <div id="brand-name">LABORATORIUM FISIKA 3D</div>
          <div id="brand-sub">Kemendikbudristek · Permendikbud 24/2007</div>
        </div>
      </div>
      <div id="brand-stats">
        <div class="stat-pill">
          <span class="sp-val green">● AKTIF</span>
          <span class="sp-label">Status Lab</span>
        </div>
        <div class="stat-pill">
          <span class="sp-val">50 Siswa</span>
          <span class="sp-label">Kapasitas</span>
        </div>
        <div class="stat-pill">
          <span class="sp-val">144 m²</span>
          <span class="sp-label">Luas Total</span>
        </div>
        <div class="stat-pill">
          <span class="sp-val cyan">100%</span>
          <span class="sp-label">Compliance</span>
        </div>
      </div>
    </div>

    <div id="controls-group">
      <!-- View mode -->
      <div class="seg-ctrl" id="mode-switcher">
        <button id="btn-mode-walk" class="seg-btn active">🚶 Walk</button>
        <button id="btn-mode-orbit" class="seg-btn">🌐 Orbit</button>
      </div>
      <!-- Lighting -->
      <div class="seg-ctrl">
        <button id="light-day" class="seg-btn active">☀️ Siang</button>
        <button id="light-lab" class="seg-btn">💡 Lab</button>
        <button id="light-cinematic" class="seg-btn">🌙 Teater</button>
      </div>
      <button id="btn-audio" class="icon-btn"><span id="audio-icon">🔊</span></button>
    </div>
  </header>

  <!-- BOTTOM BAR ────────────────────────────── -->
  <footer id="hud-bottom">
    <!-- Radar -->
    <div id="radar-wrap">
      <div class="panel-label">📡 DENAH LAB <span class="live-dot"></span></div>
      <canvas id="radar-canvas" width="180" height="112"></canvas>
      <div id="coords-display" class="mono">X: 0.0 | Z: 0.0</div>
    </div>

    <!-- Teleport dock -->
    <nav id="teleport-dock">
      <span class="dock-label">⚡ TELEPORT</span>
      <button class="tp-btn" data-target="demo">👨‍🏫 Guru & Demo</button>
      <button class="tp-btn" data-target="table1">🔬 Meja 1–5</button>
      <button class="tp-btn" data-target="table6">⚡ Meja 6–10</button>
      <button class="tp-btn" data-target="optics">🌈 Optik & Laser</button>
      <button class="tp-btn" data-target="oscilloscope">📈 Osiloskop</button>
      <button class="tp-btn" data-target="prep">🚪 Persiapan</button>
      <button class="tp-btn" data-target="safety">🧯 K3 & APAR</button>
    </nav>

    <!-- Key hints -->
    <div id="key-hints">
      <div class="kh-row"><kbd>W A S D</kbd><span>Gerak</span></div>
      <div class="kh-row"><kbd>Mouse</kbd><span>Lihat 360°</span></div>
      <div class="kh-row"><kbd>Shift</kbd><span>Sprint</span></div>
      <div class="kh-row"><kbd>Klik</kbd><span>Inspeksi</span></div>
    </div>
  </footer>

  <!-- INFO TOAST (dekati objek) ─────────────── -->
  <div id="info-toast">
    <span id="toast-icon">💡</span>
    <span id="toast-text">Jelajahi laboratorium fisika...</span>
  </div>

  <!-- STATION LABEL (floating) ──────────────── -->
  <div id="station-label">
    <div id="sl-name"></div>
    <div id="sl-desc"></div>
  </div>

  <script type="module" src="./js/main.js"></script>
</body>
</html>
